name: gems-risk-mcp
on:
  pull_request:
    paths: ['gems-risk-mcp/**', '.github/workflows/gems-risk-mcp.yml']
  push:
    branches: [main]
    paths: ['gems-risk-mcp/**', '.github/workflows/gems-risk-mcp.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gems-risk-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: gems-risk-mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p .
      - run: npm run build
